# GitHub Pages site for this repository: the same Markdown, served as a searchable wiki with the
# B3 icon as the browser-tab icon. https://u0rhs.github.io/burnout3-symbols/
title: Burnout 3 Symbols
description: Burnout 3 Takedown symbols, link maps and documentation from the prototype discs (text only)
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings

color_scheme: burnout
logo: "/assets/burnout3-takedown-logo-small.png"
favicon_ico: "/favicon.ico"

relative_links:
  enabled: true
  collections: false
titles_from_headings:
  enabled: true
  strip_title: false

search_enabled: true
search:
  heading_level: 2
  previews: 2
  button: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# The sidebar: the main sections (pages carry no front matter, so they are listed here)
nav_external_links:
  - title: Home
    url: /
    hide_icon: true
    opens_in_new_tab: false
  - title: Symbols and maps (files)
    url: /docs/files.html
    hide_icon: true
    opens_in_new_tab: false
  - title: Builds
    url: /docs/builds.html
    hide_icon: true
    opens_in_new_tab: false
  - title: Finding things
    url: /docs/data-guide.html
    hide_icon: true
    opens_in_new_tab: false
  - title: Glossary
    url: /docs/glossary.html
    hide_icon: true
    opens_in_new_tab: false
  - title: Game systems
    url: /docs/systems/
    hide_icon: true
    opens_in_new_tab: false
  - title: Classes
    url: /docs/classes/
    hide_icon: true
    opens_in_new_tab: false
  - title: Renderer overview
    url: /docs/renderer-overview.html
    hide_icon: true
    opens_in_new_tab: false
  - title: Retail memory map
    url: /docs/reference/retail-memory-map.html
    hide_icon: true
    opens_in_new_tab: false
  - title: Disc contents
