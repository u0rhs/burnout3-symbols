# GitHub Pages site for this repository: the same Markdown, served as a searchable wiki with the
# B3 icon as the browser-tab icon. https://u0rhs.github.io/burnout3-symbols/
title: Burnout 3 Symbols
description: Burnout 3 Takedown symbols, link maps and documentation from the prototype discs (text only)
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings

color_scheme: burnout
logo: "/assets/burnout3-takedown-logo-small.png"
favicon_ico: "/favicon.ico"

relative_links:
  enabled: true
  collections: false
titles_from_headings:
  enabled: true
  strip_title: false

search_enabled: true
search:
  heading_level: 2
  previews: 2
  button: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# The sidebar is generated by tools/gen_nav.py into _includes/components/site_nav.html.

aux_links:
  "GitHub":
    - "https://github.com/u0rhs/burnout3-symbols"

footer_content: "Unofficial fan documentation. Burnout 3: Takedown is a trademark of Electronic Arts. No game code or assets are included."

exclude:
  - tools/__pycache__

# Only the curated list above goes in the sidebar; no page is added to it automatically.
defaults:
  - scope:
      path: ""
    values:
      nav_exclude: true
